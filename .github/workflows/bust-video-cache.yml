name: Refresh StreamNest video uploader cache

on:
  push:
    paths:
      - '.github/workflows/bust-video-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='app.js?v=20260903-2207'
          new='app.js?v=20260903-cloudvideo1'
          if s.count(old) != 1:
              raise SystemExit(f'Expected cache marker once, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache refresh
        run: |
          rm .github/workflows/bust-video-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh cloud video uploader cache'
          git push
