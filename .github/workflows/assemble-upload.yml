name: Assemble StreamNest upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-upload.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify app.js
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/app.js.part* > app.js
          actual="$(git hash-object app.js)"
          expected="ce2941087ad91f3139331b081023a5057695a7cb"
          echo "app.js git blob: $actual"
          test "$actual" = "$expected"
      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          git rm .github/workflows/assemble-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Complete StreamNest source upload"
          git push origin HEAD:main
