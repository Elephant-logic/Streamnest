name: Upgrade StreamNest cloud video uploads

on:
  push:
    paths:
      - '.github/workflows/upgrade-cloud-video.yml'
      - '.github/scripts/upgrade_cloud_video.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python3 .github/scripts/upgrade_cloud_video.py
          node --check app.js
      - name: Commit cloud video upgrade
        run: |
          rm .github/workflows/upgrade-cloud-video.yml
          rm .github/scripts/upgrade_cloud_video.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link video uploads to StreamNest accounts'
          git push
