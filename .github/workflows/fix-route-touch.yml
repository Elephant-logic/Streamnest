name: Fix route touch handling

on:
  push:
    paths:
      - '.github/workflows/fix-route-touch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict route click handlers to navigation controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = """  document.querySelectorAll('[data-route]').forEach(btn=>{\n    btn.addEventListener('click', (e)=>{ const r = btn.getAttribute('data-route'); setRoute(r); });\n  });\n  document.querySelectorAll('.side-link').forEach(btn=>{btn.addEventListener('click', ()=>setRoute(btn.getAttribute('data-route')));});"""
          new = """  document.querySelectorAll('button[data-route], a[data-route]').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      const r = btn.getAttribute('data-route');\n      if(r) setRoute(r);\n    });\n  });"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected route handler block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check app.js
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-route-touch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix sign-in touch routing bug'
          git push
